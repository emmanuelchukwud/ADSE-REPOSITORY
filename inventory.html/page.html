<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        nav {
            margin-bottom: 30px;
            font-size: 16px;
        }
        nav a {
            color: #0056b3;
            text-decoration: none;
            margin-right: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 40px;
        }
        h2 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        h3 {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input::placeholder {
            color: #999;
        }
        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-add:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
            
        }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <a href="#">Home</a> | <a href="#">Login</a>
    </nav>

    <h1>Warehouse Inventory</h1>

    <h2>Inventory Dashboard</h2>

    <h3>Add Inventory Item</h3>
    <form>
        <div class="form-group">
            <input type="text" placeholder="Item name" required>
        </div>
        <div class="form-group">
            <input type="number" placeholder="Quantity" min="0" required>
        </div>
        <div class="form-group">
            <input type="number" placeholder="Price" step="0.01" min="0" required>
        </div>
        <button type="submit" class="btn-add">Add Item</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>Edit</td>
                <td>Delete</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
