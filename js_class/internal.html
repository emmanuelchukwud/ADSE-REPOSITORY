<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline javascript</title> 
    <style>
    button {
        margin-top: 100px;
        margin-left: 100px;
        padding: 20px;
        font-size: xx-large;
        border-radius: 10px;
    }
    
    button:hover{
        columns: blueviolet;
    }
</style>
    
</head>
<body>
   <button onclick="call_me()">Click Me...</button>
    <script>
        function call_me() {
            let name = prompt("What's my name?");
            alert("Hello, " + name);
        }
    </script>
</body>
</html>
