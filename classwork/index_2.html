<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application System</title>
    <style>
        
    </style>
    <script src="index.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Application System</h1>
    <div class="subtitle">Manage student applications and training program registrations</div>

    <form id="form">
        <h2>Student Application Form</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="Enter first name">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Enter last name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" placeholder="DD/MM/YYYY">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="Enter address">
            </div>
            <div class="form-group">
                <label for="program">Training Program</label>
                <select id="program">
                    <option value="" disabled selected>Select program</option>
                    <option value="web-design">Web Design</option>
                    <option value="frontend">Frontend Dev</option>
                    <option value="python">Python Dev</option>
                </select>
            </div>
        </div>

        <h2>Gender</h2>
        <div class="radio-group">
            <label class="radio-item">
                <input type="radio" name="gender" value="male"> Male
            </label>
            <label class="radio-item">
                <input type="radio" name="gender" value="female"> Female
            </label>
        </div>

        <h2>Skills</h2>
        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" value="team-player"> Team Player
            </label>
            <label class="checkbox-item">
                <input type="checkbox" value="organised"> Organised
            </label>
            <label class="checkbox-item">
                <input type="checkbox" value="problem-solving"> Problem Solving
            </label>
            <label class="checkbox-item">
                <input type="checkbox" value="communication"> Communication
            </label>
        </div>

        <h2>About Me</h2>
        <div class="form-group">
            <textarea placeholder="Write a short introduction about yourself..."></textarea>
        </div>

        <div class="button-container">
            <button type="submit" class="btn-submit" id="btn-submit">Submit Application</button>
            <button type="reset" class="btn-reset">Reset Form</button>
        </div>
    </form>

    <div class="table-section">
        <div class="table-header">
            
        </div>
       
    </div>
</div>
<hr>

</body>
</html>
