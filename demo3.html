<!DOCTYPE html> 
<html> 
<head> 
  <title>20 basic tags</title> 
  <meta charset="UTF-8"> 
</head>
<body> 
    

  <header> 
    <h1>Welcome to My Page</h1> 
    <nav> 
      <ul> 
        <li><a href="#about">About</a></li> 
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main> 
    <section id="about"> 
      <h2>About Me</h2>
      <p>Hello! This is my very first webpage using basic HTML tags.</p> 
    </section>

    <section id="gallery">
      <h2>Gallery</h2>
      <img src="https://via.placeholder.com/150" alt="Sample Image"> 
      <figure> <!-- 18. figure -->
        <img src="https://via.placeholder.com/100" alt="Another Image">
        <figcaption>A sample caption for the image.</figcaption> 
      </figure>
    </section>
  </main>

  <footer> 
    <p>&copy; 2026 My First Webpage</p>
  </footer>

</body>
</html>
